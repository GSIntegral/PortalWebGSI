<header class="site-header" [class.is-scrolled]="scrolled()" [class.is-open]="menuOpen()">
  <div class="container site-header__inner">
    <app-logo variant="dark" />

    <nav class="nav" [class.is-open]="menuOpen()" aria-label="Navegación principal">
      <ul class="nav__list">
        @for (item of navItems; track item.path) {
          <li>
            <a
              class="nav__link"
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              (click)="closeMenu()"
              >{{ item.label }}</a
            >
          </li>
        }
      </ul>
      <div class="nav__actions">
        @if (currentUser(); as user) {
          <a
            routerLink="/sst-dashboard"
            class="nav__link"
            routerLinkActive="is-active"
            (click)="closeMenu()"
            >{{ user.kind === 'client' ? 'Mi tablero' : 'Tablero SST' }}</a
          >
          @if (user.kind !== 'client') {
            <a
              routerLink="/portal-admin"
              class="nav__link"
              routerLinkActive="is-active"
              (click)="closeMenu()"
              >Administración</a
            >
          }
          <button type="button" class="nav__login" (click)="logout()">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Cerrar sesión
          </button>
        } @else {
          <a routerLink="/login" class="nav__login" (click)="closeMenu()">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Iniciar sesión
          </a>
          <!-- El CTA es solo para visitantes: con sesión iniciada (equipo o cliente) no se muestra. -->
          <a routerLink="/contactanos" class="btn btn--accent nav__cta" (click)="closeMenu()">
            Solicitar asesoría
          </a>
        }

        <!-- Modo claro / oscuro (igual que Facil ISO). Los iconos se alternan por CSS según la clase
             `dark` de <html>, así el HTML prerenderizado y el del navegador siempre coinciden. -->
        <button
          type="button"
          class="nav__scheme"
          (click)="toggleScheme(); closeMenu()"
          [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          [attr.title]="isDark() ? 'Modo claro' : 'Modo oscuro'"
        >
          <svg class="nav__scheme-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
            <path
              d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
          <svg class="nav__scheme-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7Z"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>
          <span class="nav__scheme-label">
            <span class="nav__scheme-to-light">Modo claro</span>
            <span class="nav__scheme-to-dark">Modo oscuro</span>
          </span>
        </button>
      </div>
    </nav>

    <button
      class="nav-toggle"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  @if (menuOpen()) {
    <div class="nav-backdrop" (click)="closeMenu()"></div>
  }
</header>
